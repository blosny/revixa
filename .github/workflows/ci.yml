name: REVIXA CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Codebase Checkout
        uses: actions/checkout@v4

      - name: Python 3.13 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Bağımlılıkların Yüklenmesi
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Pytest Otomatik Test Paketinin Çalıştırılması
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET_KEY: "ci_testing_secret_key"
        run: |
          pytest tests/ -v
